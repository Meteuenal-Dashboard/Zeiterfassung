<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeiterfassung</title>
    
    <!-- PWA / App-Modus Einstellungen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f9fafb" id="meta-theme-color">

    <!-- DYNAMISCHES MANIFEST & ICONS (Vollautomatisch, stabil für dauerhafte Installation) -->
    <script>
        (function() {
            const savedAppName = localStorage.getItem('pwa_app_name') || 'Zeiterfassung';
            const defaultIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'/%3E%3C/svg%3E";
            
            const icon192 = localStorage.getItem('pwa_icon_192') || localStorage.getItem('pwa_app_icon') || defaultIcon;
            const icon512 = localStorage.getItem('pwa_icon_512') || localStorage.getItem('pwa_app_icon') || defaultIcon;

            // FIX: Absolut stabile Start-URL (ohne Parameter), die das Android-System nach einem Neustart IMMER wiedererkennt.
            // Behebt Abstürze, falls die Datei lokal aufgerufen wird.
            let startUrl = window.location.href.split('?')[0].split('#')[0];
            
            const manifest = {
                "name": savedAppName,
                "short_name": savedAppName,
                "display": "standalone",
                "start_url": startUrl,
                "background_color": "#f9fafb",
                "theme_color": "#4f46e5",
                "icons": [
                    {
                        "src": icon192,
                        "sizes": "192x192",
                        "type": icon192.startsWith('data:image/svg') ? "image/svg+xml" : "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": icon512,
                        "sizes": "512x512",
                        "type": icon512.startsWith('data:image/svg') ? "image/svg+xml" : "image/png",
                        "purpose": "any maskable"
                    }
                ]
            };
            
            const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            
            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.id = 'dynamic-manifest';
            linkManifest.href = manifestDataUrl;
            document.head.appendChild(linkManifest);

            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon';
            linkApple.id = 'apple-touch-icon';
            linkApple.href = icon192;
            document.head.appendChild(linkApple);
        })();
    </script>
    
    <!-- Tailwind CSS (Design) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- React & ReactDOM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>
    
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans fixed inset-0 overflow-hidden">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo } = React;

        // Globale Liste mit 22 Tailwind-Farben für die Designs
        const tailwindColors = ['slate', 'gray', 'zinc', 'neutral', 'stone', 'red', 'orange', 'amber', 'yellow', 'lime', 'green', 'emerald', 'teal', 'cyan', 'sky', 'blue', 'indigo', 'violet', 'purple', 'fuchsia', 'pink', 'rose'];

        // ==========================================
        // ICONS
        // ==========================================
        const IconBase = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{props.children}</svg>
        );
        const Plus = (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const List = (props) => <IconBase {...props}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></IconBase>;
        const Calendar = (props) => <IconBase {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const CheckCircle2 = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l3 3 5-6"></path></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></IconBase>;
        const Moon = (props) => <IconBase {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></IconBase>;
        const Sun = (props) => <IconBase {...props}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></IconBase>;
        const Share2 = (props) => <IconBase {...props}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></IconBase>;
        const ImageLogo = (props) => <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></IconBase>;
        const AlertTriangle = (props) => <IconBase {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconBase>;

        // ==========================================
        // CORE LOGIC & UTILITIES
        // ==========================================

        const formatDate = (dateString) => {
          const [year, month, day] = dateString.split('-');
          if(year && month && day) {
              return `${day}.${month}.${year}`;
          }
          const d = new Date(dateString);
          return d.toLocaleDateString('de-DE', { year: 'numeric', month: '2-digit', day: '2-digit' });
        };

        const calculateDuration = (start, end) => {
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          
          let totalMinutes = (endH * 60 + endM) - (startH * 60 + startM);
          if (totalMinutes < 0) totalMinutes += 24 * 60; // Über Mitternacht
          
          return {
            netHours: (totalMinutes / 60).toFixed(2),
            netMinutes: totalMinutes
          };
        };

        const formatCurrency = (amount) => {
          return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount || 0);
        };

        // ==========================================
        // STATE MANAGEMENT (CUSTOM HOOKS)
        // ==========================================

        const useTimeTracker = () => {
          const [entries, setEntries] = useState([]);
          const [settings, setSettings] = useState({ hourlyRate: 15, userName: '', darkMode: false, theme: 'indigo' });

          useEffect(() => {
            const savedEntries = JSON.parse(localStorage.getItem('time_entries') || '[]');
            const savedSettings = JSON.parse(localStorage.getItem('time_settings') || 'null');
            
            setEntries(savedEntries);
            if (savedSettings) {
                if (!savedSettings.theme) savedSettings.theme = 'indigo';
                setSettings(savedSettings);
            }
          }, []);

          const saveEntries = (newEntries) => {
            setEntries(newEntries);
            localStorage.setItem('time_entries', JSON.stringify(newEntries));
          };

          const saveSettings = (newSettings) => {
            setSettings(newSettings);
            localStorage.setItem('time_settings', JSON.stringify(newSettings));
          };

          const addManualEntry = (entry) => {
            const { netHours } = calculateDuration(entry.startTime, entry.endTime);
            const newEntry = {
              ...entry,
              id: Date.now().toString(),
              netHours: parseFloat(netHours),
              earned: parseFloat(netHours) * settings.hourlyRate
            };
            saveEntries([newEntry, ...entries].sort((a, b) => new Date(b.date) - new Date(a.date)));
          };

          const deleteEntry = (id) => {
            saveEntries(entries.filter(e => e.id !== id));
          };

          return {
            entries, settings, addManualEntry, deleteEntry, saveSettings
          };
        };

        // ==========================================
        // VIEWS & COMPONENTS
        // ==========================================

        const ManualEntryView = ({ addManualEntry, setView, settings }) => {
          const theme = settings.theme || 'indigo';
          const [form, setForm] = useState({
            date: new Date().toISOString().split('T')[0],
            startTime: '08:00',
            endTime: '16:30'
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            addManualEntry(form);
            setView('history');
          };

          return (
            <div className="p-6 h-full overflow-y-auto animate-in slide-in-from-right-4 duration-300">
              <h2 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Zeit eintragen</h2>
              
              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="space-y-2">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Calendar className="w-4 h-4 mr-2"/> Datum</label>
                  <input type="date" required value={form.date} onChange={e => setForm({...form, date: e.target.value})}
                    className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none transition-all`} />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div className="space-y-2">
                    <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Clock className="w-4 h-4 mr-2"/> Startzeit</label>
                    <input type="time" required value={form.startTime} onChange={e => setForm({...form, startTime: e.target.value})}
                      className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none transition-all`} />
                  </div>
                  <div className="space-y-2">
                    <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Clock className="w-4 h-4 mr-2"/> Endzeit</label>
                    <input type="time" required value={form.endTime} onChange={e => setForm({...form, endTime: e.target.value})}
                      className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none transition-all`} />
                  </div>
                </div>

                <button type="submit" className={`w-full py-4 bg-${theme}-600 hover:bg-${theme}-700 text-white rounded-xl font-bold shadow-lg shadow-${theme}-600/30 transition-all flex items-center justify-center mt-8 active:scale-[0.98]`}>
                  <CheckCircle2 className="w-5 h-5 mr-2" /> Eintrag speichern
                </button>
              </form>
            </div>
          );
        };

        const HistoryView = ({ entries, deleteEntry, settings }) => {
          const theme = settings.theme || 'indigo';
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().substring(0, 7)); // YYYY-MM
          const [isGenerating, setIsGenerating] = useState(false);

          const filteredEntries = useMemo(() => {
            return entries.filter(e => e.date.startsWith(selectedMonth));
          }, [entries, selectedMonth]);

          const stats = useMemo(() => {
            return filteredEntries.reduce((acc, curr) => ({
              hours: acc.hours + curr.netHours,
              earned: acc.earned + curr.earned
            }), { hours: 0, earned: 0 });
          }, [filteredEntries]);

          const displayMonth = selectedMonth.split('-').reverse().join('.');

          const exportCSV = () => {
            const headers = ['Datum', 'Start', 'Ende', 'Stunden', 'Verdienst'];
            const rows = filteredEntries.map(e => [
              formatDate(e.date), e.startTime, e.endTime, e.netHours.toString().replace('.', ','), e.earned.toFixed(2).replace('.', ',')
            ]);
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + [headers.join(';'), ...rows.map(e => e.join(';'))].join("\n");
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            
            const fileName = settings.userName ? `Arbeitszeiten_${settings.userName}_${selectedMonth}.csv` : `Arbeitszeiten_${selectedMonth}.csv`;
            link.setAttribute("download", fileName.replace(/\s+/g, '_'));
            document.body.appendChild(link);
            link.click();
            link.remove();
          };

          const exportPDF = () => {
            window.print();
          };

          const shareViaWhatsApp = async () => {
            if (isGenerating) return;
            setIsGenerating(true);

            try {
              const printArea = document.querySelector('.print-area');
              const clone = printArea.cloneNode(true);
              
              clone.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
              clone.querySelectorAll('.no-print').forEach(el => el.remove());
              
              clone.querySelectorAll('.print-table').forEach(el => {
                  el.classList.remove('print-table');
                  el.style.display = 'table';
                  el.style.width = '100%';
                  el.style.tableLayout = 'fixed';
              });
              clone.querySelectorAll('.print-block').forEach(el => {
                  el.classList.remove('print-block');
                  el.style.display = 'block';
              });
              
              const container = document.createElement('div');
              container.style.width = '800px'; 
              container.style.padding = '40px';
              container.style.background = 'white';
              container.style.color = 'black';
              container.style.fontFamily = 'sans-serif';
              container.style.boxSizing = 'border-box';
              
              container.appendChild(clone);

              const fileName = settings.userName ? `Arbeitszeiten_${settings.userName}_${selectedMonth}.pdf` : `Arbeitszeiten_${selectedMonth}.pdf`;
              const finalFileName = fileName.replace(/\s+/g, '_');

              const opt = {
                margin:       0, 
                filename:     finalFileName,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    windowWidth: 800,
                    width: 800
                },
                jsPDF:        { unit: 'px', format: [800, 1131], orientation: 'portrait' } 
              };

              const pdfBlob = await html2pdf().set(opt).from(container).outputPdf('blob');
              
              const file = new File([pdfBlob], finalFileName, { type: 'application/pdf' });

              const downloadFallback = () => {
                const url = URL.createObjectURL(pdfBlob);
                const a = document.createElement('a');
                a.href = url;
                a.download = finalFileName;
                a.click();
                URL.revokeObjectURL(url);
              };

              if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                  await navigator.share({
                    title: 'Stundenzettel PDF',
                    files: [file]
                  });
                } catch (shareErr) {
                  console.log("Teilen vom Nutzer abgebrochen oder blockiert.");
                  if (shareErr.name === 'NotAllowedError') {
                      downloadFallback();
                  }
                }
              } else {
                downloadFallback();
                alert("Dein Handy blockiert das direkte Teilen in Apps. Die PDF wurde stattdessen heruntergeladen!");
              }
            } catch (err) {
              console.error('PDF Generierung fehlgeschlagen:', err);
              alert("Fehler beim Erstellen der PDF. Bitte versuche es noch einmal.");
            } finally {
              setIsGenerating(false);
            }
          };

          return (
            <div className="p-6 h-full flex flex-col animate-in slide-in-from-bottom-4 duration-300">
              <div className="flex justify-between items-center mb-6 no-print">
                <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Übersicht</h2>
                <input 
                  type="month" 
                  value={selectedMonth}
                  onChange={(e) => setSelectedMonth(e.target.value)}
                  className="p-2 text-base rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 font-medium outline-none text-gray-900 dark:text-white"
                />
              </div>

              {/* Summary Cards */}
              <div className="grid grid-cols-2 gap-4 mb-6 no-print">
                <div className={`bg-${theme}-50 dark:bg-${theme}-900/30 p-4 rounded-2xl border border-${theme}-100 dark:border-${theme}-800/50`}>
                  <p className={`text-sm text-${theme}-600 dark:text-${theme}-400 mb-1 font-medium`}>Gesamtstunden</p>
                  <p className={`text-2xl font-bold text-${theme}-900 dark:text-${theme}-100`}>{stats.hours.toFixed(2)} h</p>
                </div>
                <div className="bg-green-50 dark:bg-green-900/30 p-4 rounded-2xl border border-green-100 dark:border-green-800/50">
                  <p className="text-sm text-green-600 dark:text-green-400 mb-1 font-medium">Verdienst</p>
                  <p className="text-2xl font-bold text-green-900 dark:text-green-100">{formatCurrency(stats.earned)}</p>
                </div>
              </div>

              {/* Export Buttons */}
              <div className="flex space-x-2 mb-6 no-print">
                <button onClick={exportPDF} className="flex-1 flex items-center justify-center p-2 bg-gray-900 dark:bg-gray-700 text-white rounded-xl text-sm font-medium hover:bg-gray-800 transition active:scale-[0.98]">
                  <FileText className="w-4 h-4 mr-1"/> Drucken
                </button>
                <button onClick={exportCSV} className="flex-1 flex items-center justify-center p-2 bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-xl text-sm font-medium hover:bg-gray-200 transition active:scale-[0.98]">
                  <Download className="w-4 h-4 mr-1"/> CSV
                </button>
                <button onClick={shareViaWhatsApp} disabled={isGenerating} className={`flex-1 flex items-center justify-center p-2 text-white rounded-xl text-sm font-medium transition active:scale-[0.98] ${isGenerating ? 'bg-green-400' : 'bg-green-500 hover:bg-green-600'}`}>
                  {isGenerating ? <span className="animate-pulse">Lädt...</span> : <><Share2 className="w-4 h-4 mr-1"/> Teilen (PDF)</>}
                </button>
              </div>

              {/* List */}
              <div className="flex-1 overflow-y-auto space-y-3 pb-24 print-area">
                <div className="hidden print-block mb-6">
                  {/* Inline Styles sichern das Aussehen auch ohne Tailwind im PDF */}
                  <h3 className="text-2xl font-bold" style={{fontSize: '24px', fontWeight: 'bold', marginBottom: '16px', color: 'black'}}>Stundenzettel</h3>
                  <p className="text-gray-600 mt-1" style={{marginBottom: '4px', color: '#4b5563', fontSize: '14px'}}>Mitarbeiter: <strong style={{color: 'black'}}>{settings.userName || '_______________'}</strong></p>
                  <p className="text-gray-600" style={{marginBottom: '20px', color: '#4b5563', fontSize: '14px'}}>Monat: <strong style={{color: 'black'}}>{displayMonth}</strong></p>
                </div>

                {filteredEntries.length === 0 ? (
                  <div className="text-center text-gray-500 mt-10 no-print">Keine Einträge in diesem Monat.</div>
                ) : (
                  <table className="w-full hidden print-table" style={{ width: '100%', borderCollapse: 'collapse', marginTop: '20px', color: 'black' }}>
                    <thead>
                      <tr>
                        <th style={{ width: '20%', borderBottom: '2px solid #000', padding: '8px 4px', textAlign: 'left', color: 'black' }}>Datum</th>
                        <th style={{ width: '15%', borderBottom: '2px solid #000', padding: '8px 4px', textAlign: 'left', color: 'black' }}>Start</th>
                        <th style={{ width: '15%', borderBottom: '2px solid #000', padding: '8px 4px', textAlign: 'left', color: 'black' }}>Ende</th>
                        <th style={{ width: '25%', borderBottom: '2px solid #000', padding: '8px 4px', textAlign: 'right', color: 'black' }}>Stunden</th>
                        <th style={{ width: '25%', borderBottom: '2px solid #000', padding: '8px 4px', textAlign: 'right', color: 'black' }}>Verdienst</th>
                      </tr>
                    </thead>
                    <tbody>
                      {filteredEntries.map(e => (
                        <tr key={e.id}>
                          <td style={{ borderBottom: '1px solid #ddd', padding: '8px 4px', textAlign: 'left', color: 'black' }}>{formatDate(e.date)}</td>
                          <td style={{ borderBottom: '1px solid #ddd', padding: '8px 4px', textAlign: 'left', color: 'black' }}>{e.startTime}</td>
                          <td style={{ borderBottom: '1px solid #ddd', padding: '8px 4px', textAlign: 'left', color: 'black' }}>{e.endTime}</td>
                          <td style={{ borderBottom: '1px solid #ddd', padding: '8px 4px', textAlign: 'right', fontWeight: 'bold', color: 'black' }}>{e.netHours} h</td>
                          <td style={{ borderBottom: '1px solid #ddd', padding: '8px 4px', textAlign: 'right', color: 'black' }}>{formatCurrency(e.earned)}</td>
                        </tr>
                      ))}
                      <tr style={{ backgroundColor: '#f9fafb', fontWeight: 'bold', fontSize: '1.125rem' }}>
                        <td colSpan="3" style={{ borderTop: '2px solid #000', padding: '12px 4px', textAlign: 'right', color: 'black' }}>Gesamtsumme:</td>
                        <td style={{ borderTop: '2px solid #000', padding: '12px 4px', textAlign: 'right', color: 'black' }}>{stats.hours.toFixed(2)} h</td>
                        <td style={{ borderTop: '2px solid #000', padding: '12px 4px', textAlign: 'right', color: 'black' }}>{formatCurrency(stats.earned)}</td>
                      </tr>
                    </tbody>
                  </table>
                )}

                {/* UI Cards (Hidden in Print) */}
                <div className="no-print space-y-3">
                  {filteredEntries.map(entry => (
                    <div key={entry.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center group">
                      <div>
                        <p className="font-semibold text-gray-800 dark:text-gray-200">{formatDate(entry.date)}</p>
                        <p className="text-sm text-gray-500 dark:text-gray-400 mt-1">
                          {entry.startTime} Uhr - {entry.endTime} Uhr
                        </p>
                      </div>
                      <div className="text-right flex items-center">
                        <div className="mr-4">
                          <p className={`font-bold text-${theme}-600 dark:text-${theme}-400`}>{entry.netHours} h</p>
                          <p className="text-xs text-gray-400">{formatCurrency(entry.earned)}</p>
                        </div>
                        <button onClick={() => deleteEntry(entry.id)} className="p-2 text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition opacity-100 md:opacity-0 group-hover:opacity-100">
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        const SettingsView = ({ settings, saveSettings, installPrompt, handleInstallClick }) => {
          const theme = settings.theme || 'indigo';
          const [pwaName, setPwaName] = useState(localStorage.getItem('pwa_app_name') || 'Zeiterfassung');
          
          const defaultIconSrc = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'/%3E%3C/svg%3E";
          const savedIconSrc = localStorage.getItem('pwa_icon_192') || localStorage.getItem('pwa_app_icon') || defaultIconSrc;

          const [previewIcon, setPreviewIcon] = useState(savedIconSrc);

          const handleChange = (e) => {
            const { name, value } = e.target;
            saveSettings({ ...settings, [name]: name === 'hourlyRate' ? (parseFloat(value) || 0) : value });
          };

          const handleNameSave = () => {
            localStorage.setItem('pwa_app_name', pwaName);
            window.location.reload(); 
          };

          const handleIconSelect = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new window.Image();
                    img.onload = () => {
                        const size = Math.min(img.width, img.height);
                        const startX = (img.width - size) / 2;
                        const startY = (img.height - size) / 2;

                        const resizeImage = (targetSize) => {
                            const canvas = document.createElement('canvas');
                            canvas.width = targetSize;
                            canvas.height = targetSize;
                            const ctx = canvas.getContext('2d');
                            
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, targetSize, targetSize);
                            ctx.drawImage(img, startX, startY, size, size, 0, 0, targetSize, targetSize);
                            
                            return canvas.toDataURL('image/png'); // Muss PNG für WebAPK sein
                        };

                        const newIcon192 = resizeImage(192);
                        const newIcon512 = resizeImage(512);

                        // Automatisch abspeichern
                        localStorage.setItem('pwa_icon_192', newIcon192);
                        localStorage.setItem('pwa_icon_512', newIcon512);
                        setPreviewIcon(newIcon192); 
                        
                        // Live Manifest Update für den Installations-Prompt
                        const manifestObj = {
                            "name": pwaName,
                            "short_name": pwaName,
                            "display": "standalone",
                            "start_url": window.location.href.split('?')[0].split('#')[0],
                            "background_color": settings.darkMode ? "#111827" : "#f9fafb",
                            "theme_color": "#4f46e5",
                            "icons": [
                                { "src": newIcon192, "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
                                { "src": newIcon512, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                            ]
                        };
                        const newManifestUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
                        document.getElementById('dynamic-manifest').href = newManifestUrl;
                        document.getElementById('apple-touch-icon').href = newIcon192;

                        // App löst SOFORT den Installationsbildschirm des Handys aus
                        if (installPrompt) {
                            installPrompt.prompt();
                            installPrompt.userChoice.then(() => {
                                window.location.reload(); // Danach neuladen für finale UI Anpassung
                            });
                        } else {
                            alert("Icon erfolgreich angepasst! Du kannst die App nun über das Browser-Menü deines Handys zum Startbildschirm hinzufügen.");
                            window.location.reload();
                        }
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
          };

          return (
            <div className="p-6 h-full overflow-y-auto animate-in slide-in-from-left-4 duration-300 pb-32">
              <h2 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Einstellungen</h2>

              {/* Install Button bleibt als Fallback sichtbar, falls der Nutzer den Prompt abricht */}
              {installPrompt && (
                <div className="space-y-4 bg-green-50 dark:bg-green-900/20 p-6 rounded-2xl shadow-sm border border-green-200 dark:border-green-800/50 mb-6">
                  <h3 className="font-bold text-green-900 dark:text-green-100 flex items-center">App auf dem Handy installieren</h3>
                  <p className="text-xs text-green-700 dark:text-green-400 leading-relaxed mb-4">
                    Installiere diese App jetzt dauerhaft auf deinem Homescreen. Sie funktioniert danach wie eine echte native App.
                  </p>
                  <button type="button" onClick={handleInstallClick} className="w-full py-3 bg-green-600 hover:bg-green-700 text-white rounded-xl font-medium transition active:scale-[0.98] shadow-md shadow-green-600/30 flex justify-center items-center">
                    <Download className="w-5 h-5 mr-2" /> App Installieren
                  </button>
                </div>
              )}
              
              <div className="space-y-6 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                
                <div className="flex items-center justify-between p-3 rounded-xl border border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-900">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center cursor-pointer" onClick={() => saveSettings({ ...settings, darkMode: !settings.darkMode })}>
                    {settings.darkMode ? <Moon className={`w-4 h-4 mr-2 text-${theme}-400`}/> : <Sun className="w-4 h-4 mr-2 text-orange-400"/>}
                    Dark Mode
                  </label>
                  <button 
                    type="button"
                    onClick={() => saveSettings({ ...settings, darkMode: !settings.darkMode })}
                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none ${settings.darkMode ? `bg-${theme}-600` : 'bg-gray-300'}`}
                  >
                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${settings.darkMode ? 'translate-x-6' : 'translate-x-1'}`} />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><User className="w-4 h-4 mr-2"/> Dein Name</label>
                  <input 
                    type="text" name="userName" value={settings.userName} onChange={handleChange} placeholder="Vor- und Nachname"
                    className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none`} 
                  />
                  <p className="text-xs text-gray-500 mt-1">Wird für den PDF-Export verwendet.</p>
                </div>

                <div className="space-y-2">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center">Stundenlohn (€)</label>
                  <input 
                    type="number" step="0.5" name="hourlyRate" value={settings.hourlyRate} onChange={handleChange}
                    className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none`} 
                  />
                </div>
              </div>
              
              <div className="space-y-4 bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 mb-6">
                <h3 className="font-bold text-gray-800 dark:text-white flex items-center">App Design (Farbe)</h3>
                <p className="text-xs text-gray-500 mb-3">Wähle dein Lieblings-Design (22 Farben):</p>
                <div className="grid grid-cols-6 gap-3">
                  {tailwindColors.map(c => (
                    <button
                      key={c}
                      type="button"
                      onClick={() => saveSettings({ ...settings, theme: c })}
                      className={`w-10 h-10 rounded-full bg-${c}-500 shadow-sm border-2 transition-transform ${settings.theme === c ? 'border-gray-900 dark:border-white scale-110' : 'border-transparent hover:scale-105'}`}
                      aria-label={`Design in ${c}`}
                    />
                  ))}
                </div>
              </div>

              <div className={`space-y-4 bg-${theme}-50 dark:bg-${theme}-900/20 p-6 rounded-2xl shadow-sm border border-${theme}-100 dark:border-${theme}-800/50 mb-6`}>
                <h3 className={`font-bold text-${theme}-900 dark:text-${theme}-100 flex items-center`}>App Personalisieren</h3>
                
                <div className="space-y-3">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300">App Name</label>
                  <div className="flex flex-col space-y-3">
                    <input 
                      type="text" value={pwaName} onChange={e => setPwaName(e.target.value)} placeholder="Mein Stundenbuch"
                      className="w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white outline-none" 
                    />
                    <button type="button" onClick={handleNameSave} className={`w-full py-3 bg-${theme}-600 hover:bg-${theme}-700 text-white rounded-xl font-medium transition active:scale-[0.98]`}>
                      Namen speichern
                    </button>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><ImageLogo className="w-4 h-4 mr-2"/> Eigenes App Icon (Foto)</label>
                  
                  <div className="flex items-center space-x-3">
                    <img src={previewIcon} alt="Aktuelles Icon" className={`w-16 h-16 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 object-cover shrink-0 bg-${theme}-50 dark:bg-gray-800 p-0.5`} />
                    <label className={`flex-1 flex items-center justify-center p-4 border-2 border-dashed border-${theme}-300 dark:border-${theme}-700 rounded-xl cursor-pointer hover:bg-${theme}-100 dark:hover:bg-${theme}-800/40 transition h-16`}>
                      <span className={`text-sm text-${theme}-600 dark:text-${theme}-400 font-medium text-center leading-tight py-1`}>Bild wählen &<br/>sofort installieren</span>
                      {/* Der Speichern-Button ist endgültig weg! Alles 100% automatisch. */}
                      <input type="file" accept="image/png, image/jpeg, image/webp" onClick={(e) => {e.target.value = null;}} onChange={handleIconSelect} className="hidden" />
                    </label>
                  </div>
                </div>
              </div>

            </div>
          );
        };

        // ==========================================
        // MAIN APPLICATION
        // ==========================================

        function App() {
          const [currentView, setCurrentView] = useState('manual');
          const tracker = useTimeTracker();
          const theme = tracker.settings.theme || 'indigo';

          // Install-Prompt Management
          const [installPrompt, setInstallPrompt] = useState(null);
          const [isLocalFile, setIsLocalFile] = useState(false);

          useEffect(() => {
            // WARNUNG: Wenn der Nutzer die Datei lokal vom Handy öffnet
            if (window.location.protocol === 'file:') {
               setIsLocalFile(true);
            }

            const handleBeforeInstallPrompt = (e) => {
              e.preventDefault(); 
              setInstallPrompt(e); 
            };
            window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          }, []);

          const handleInstallClick = async () => {
            if (!installPrompt) return;
            installPrompt.prompt(); 
            const { outcome } = await installPrompt.userChoice;
            if (outcome === 'accepted') {
              setInstallPrompt(null); 
            }
          };

          useEffect(() => {
            if (tracker.settings.darkMode) {
              document.documentElement.classList.add('dark');
              document.getElementById('meta-theme-color').setAttribute('content', '#111827');
            } else {
              document.documentElement.classList.remove('dark');
              document.getElementById('meta-theme-color').setAttribute('content', '#f9fafb');
            }
          }, [tracker.settings.darkMode]);

          useEffect(() => {
            const style = document.createElement('style');
            style.innerHTML = `
              @page { margin: 1cm; size: A4 portrait; }
              @media print {
                body, html { height: auto !important; min-height: auto !important; overflow: visible !important; background: white; color: black; }
                #root { height: auto !important; overflow: visible !important; }
                .h-\\[100dvh\\] { height: auto !important; }
                .overflow-hidden { overflow: visible !important; }
                .max-w-md { max-width: 100% !important; box-shadow: none !important; margin: 0 !important; border: none !important;}
                .no-print { display: none !important; }
                .print-area { padding: 0 !important; overflow: visible !important; margin-top: 0 !important; }
                .print-block { display: block !important; }
                .print-table { display: table !important; width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 11pt; }
                tr { page-break-inside: avoid; }
              }
              .print-table { display: none; }
              .print-block { display: none; }
            `;
            document.head.appendChild(style);
            return () => document.head.removeChild(style);
          }, []);

          const navItems = [
            { id: 'manual', icon: Plus, label: 'Eintragen' },
            { id: 'history', icon: List, label: 'Übersicht' },
            { id: 'settings', icon: Settings, label: 'Einstellungen' },
          ];

          const customAppName = localStorage.getItem('pwa_app_name') || 'Zeiterfassung';
          const customAppIcon = localStorage.getItem('pwa_icon_192') || localStorage.getItem('pwa_app_icon');

          return (
            <div className="max-w-md mx-auto h-full flex flex-col bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans shadow-2xl relative overflow-hidden transition-colors duration-300">
              
              {/* LOKALE DATEI WARNUNG */}
              {isLocalFile && (
                  <div className="bg-red-500 text-white p-3 text-xs flex items-start gap-3 z-50">
                     <AlertTriangle className="w-6 h-6 shrink-0 mt-0.5" />
                     <p>
                        <b>Achtung!</b> Du hast diese App als lokale Datei auf deinem Handy geöffnet. 
                        <b> Dein Handy wird sie beim Neustart löschen.</b> Lade diese Datei auf <i>tiiny.host</i> hoch 
                        und öffne den dortigen Link, damit sie für immer auf deinem Handy bleibt.
                     </p>
                  </div>
              )}

              <header className="px-6 py-4 flex items-center justify-between no-print border-b border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 transition-colors duration-300">
                <div className="flex items-center space-x-3">
                  {customAppIcon && !customAppIcon.startsWith('data:image/svg') ? (
                    <img src={customAppIcon} alt="App Logo" className="w-8 h-8 rounded-lg shadow-sm object-cover border border-gray-100 dark:border-gray-700" />
                  ) : (
                    <Clock className={`w-6 h-6 text-${theme}-600 dark:text-${theme}-400`} />
                  )}
                  <h1 className={`text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-${theme}-600 to-${theme}-800`}>
                    {customAppName}
                  </h1>
                </div>
              </header>

              <main className="flex-1 overflow-hidden relative">
                {currentView === 'manual' && <ManualEntryView settings={tracker.settings} addManualEntry={tracker.addManualEntry} setView={setCurrentView} />}
                {currentView === 'history' && <HistoryView {...tracker} />}
                {currentView === 'settings' && <SettingsView {...tracker} installPrompt={installPrompt} handleInstallClick={handleInstallClick} />}
              </main>

              <nav className="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-800 px-6 py-3 pb-safe no-print z-50 transition-colors duration-300 shrink-0">
                <div className="flex justify-around items-center">
                  {navItems.map(item => {
                    const Icon = item.icon;
                    const isActive = currentView === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setCurrentView(item.id)}
                        className={`flex flex-col items-center p-2 rounded-xl transition-all duration-200 ${
                          isActive ? `text-${theme}-600 dark:text-${theme}-400 scale-110` : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-300'
                        }`}
                      >
                        <Icon className={`w-6 h-6 mb-1 ${isActive ? `stroke-${theme}-600 dark:stroke-${theme}-400` : ''}`} />
                        <span className="text-[10px] font-medium">{item.label}</span>
                      </button>
                    );
                  })}
                </div>
              </nav>

              {/* Versteckter Block, damit Tailwind die dynamischen Farbklassen vorab rendert */}
              <div className="hidden" aria-hidden="true">
                {tailwindColors.map(c => (
                  <div key={c} className={`bg-${c}-50 bg-${c}-100 bg-${c}-300 bg-${c}-400 bg-${c}-500 bg-${c}-600 bg-${c}-700 bg-${c}-800/50 bg-${c}-900/20 bg-${c}-900/30 text-${c}-100 text-${c}-400 text-${c}-500 text-${c}-600 text-${c}-900 border-${c}-100 border-${c}-300 border-${c}-700 border-${c}-800/50 shadow-${c}-600/30 from-${c}-600 to-${c}-800 stroke-${c}-400 stroke-${c}-600 hover:bg-${c}-100 hover:bg-${c}-700 dark:hover:bg-${c}-800/40 focus:ring-${c}-500`}></div>
                ))}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
