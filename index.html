<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeiterfassung</title>
    
    <!-- PWA / App-Modus Einstellungen -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f9fafb" id="meta-theme-color">

    <!-- DYNAMISCHES MANIFEST & ICONS (Vollautomatisch, WebAPK-konform für Android & iOS) -->
    <script>
        (function() {
            const savedAppName = localStorage.getItem('pwa_app_name') || 'Zeiterfassung';
            const defaultIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'/%3E%3C/svg%3E";
            
            const icon192 = localStorage.getItem('pwa_icon_192') || localStorage.getItem('pwa_app_icon') || defaultIcon;
            const icon512 = localStorage.getItem('pwa_icon_512') || localStorage.getItem('pwa_app_icon') || defaultIcon;

            // WICHTIG: Eine feste URL ohne Hash oder Parameter für die WebAPK-Generierung
            const cleanUrl = window.location.origin + window.location.pathname;

            const manifest = {
                "id": "zeiterfassung-pwa-v1", // Eindeutige ID für Android zur dauerhaften Erkennung
                "name": savedAppName,
                "short_name": savedAppName,
                "display": "standalone",
                "orientation": "portrait",
                "start_url": cleanUrl,
                "background_color": "#f9fafb",
                "theme_color": "#4f46e5",
                "icons": [
                    {
                        "src": icon192,
                        "sizes": "192x192",
                        "type": icon192.startsWith('data:image/svg') ? "image/svg+xml" : "image/png",
                        "purpose": "any maskable"
                    },
                    {
                        "src": icon512,
                        "sizes": "512x512",
                        "type": icon512.startsWith('data:image/svg') ? "image/svg+xml" : "image/png",
                        "purpose": "any maskable"
                    }
                ]
            };
            
            const manifestDataUrl = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
            
            const linkManifest = document.createElement('link');
            linkManifest.rel = 'manifest';
            linkManifest.id = 'dynamic-manifest';
            linkManifest.href = manifestDataUrl;
            document.head.appendChild(linkManifest);

            const linkApple = document.createElement('link');
            linkApple.rel = 'apple-touch-icon';
            linkApple.id = 'apple-touch-icon';
            linkApple.href = icon192;
            document.head.appendChild(linkApple);
        })();
    </script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <!-- React & Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans fixed inset-0 overflow-hidden">
    
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel" data-presets="react,env">
        const { useState, useEffect, useMemo } = React;

        const tailwindColors = ['slate', 'gray', 'zinc', 'neutral', 'stone', 'red', 'orange', 'amber', 'yellow', 'lime', 'green', 'emerald', 'teal', 'cyan', 'sky', 'blue', 'indigo', 'violet', 'purple', 'fuchsia', 'pink', 'rose'];

        // ==========================================
        // ICONS
        // ==========================================
        const IconBase = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{props.children}</svg>
        );
        const Plus = (props) => <IconBase {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconBase>;
        const List = (props) => <IconBase {...props}><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></IconBase>;
        const Settings = (props) => <IconBase {...props}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></IconBase>;
        const FileText = (props) => <IconBase {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconBase>;
        const Download = (props) => <IconBase {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></IconBase>;
        const Calendar = (props) => <IconBase {...props}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></IconBase>;
        const Trash2 = (props) => <IconBase {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></IconBase>;
        const CheckCircle2 = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"></circle><path d="M8 12.5l3 3 5-6"></path></IconBase>;
        const User = (props) => <IconBase {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></IconBase>;
        const Moon = (props) => <IconBase {...props}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></IconBase>;
        const Sun = (props) => <IconBase {...props}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></IconBase>;
        const Share2 = (props) => <IconBase {...props}><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></IconBase>;
        const ImageLogo = (props) => <IconBase {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></IconBase>;

        // ==========================================
        // UTILITIES
        // ==========================================
        const formatDate = (dateString) => {
          const [year, month, day] = dateString.split('-');
          if(year && month && day) return `${day}.${month}.${year}`;
          return new Date(dateString).toLocaleDateString('de-DE');
        };

        const calculateDuration = (start, end) => {
          const [startH, startM] = start.split(':').map(Number);
          const [endH, endM] = end.split(':').map(Number);
          let totalMinutes = (endH * 60 + endM) - (startH * 60 + startM);
          if (totalMinutes < 0) totalMinutes += 24 * 60;
          return { netHours: (totalMinutes / 60).toFixed(2), netMinutes: totalMinutes };
        };

        const formatCurrency = (amount) => new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(amount || 0);

        // ==========================================
        // HOOKS
        // ==========================================
        const useTimeTracker = () => {
          const [entries, setEntries] = useState([]);
          const [settings, setSettings] = useState({ hourlyRate: 15, userName: '', darkMode: false, theme: 'indigo' });

          useEffect(() => {
            setEntries(JSON.parse(localStorage.getItem('time_entries') || '[]'));
            const savedSettings = JSON.parse(localStorage.getItem('time_settings') || 'null');
            if (savedSettings) setSettings(prev => ({...prev, ...savedSettings}));
          }, []);

          const saveEntries = (newEntries) => { setEntries(newEntries); localStorage.setItem('time_entries', JSON.stringify(newEntries)); };
          const saveSettings = (newSettings) => { setSettings(newSettings); localStorage.setItem('time_settings', JSON.stringify(newSettings)); };

          const addManualEntry = (entry) => {
            const { netHours } = calculateDuration(entry.startTime, entry.endTime);
            const newEntry = { ...entry, id: Date.now().toString(), netHours: parseFloat(netHours), earned: parseFloat(netHours) * settings.hourlyRate };
            saveEntries([newEntry, ...entries].sort((a, b) => new Date(b.date) - new Date(a.date)));
          };

          const deleteEntry = (id) => saveEntries(entries.filter(e => e.id !== id));

          return { entries, settings, addManualEntry, deleteEntry, saveSettings };
        };

        // ==========================================
        // VIEWS
        // ==========================================
        const ManualEntryView = ({ addManualEntry, setView, settings }) => {
          const theme = settings.theme || 'indigo';
          const [form, setForm] = useState({ date: new Date().toISOString().split('T')[0], startTime: '08:00', endTime: '16:30' });
          const handleSubmit = (e) => { e.preventDefault(); addManualEntry(form); setView('history'); };

          return (
            <div className="p-6 h-full overflow-y-auto animate-in slide-in-from-right-4 duration-300">
              <h2 className="text-2xl font-bold mb-6 text-gray-800 dark:text-white">Zeit eintragen</h2>
              <form onSubmit={handleSubmit} className="space-y-6">
                <div className="space-y-2">
                  <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Calendar className="w-4 h-4 mr-2"/> Datum</label>
                  <input type="date" required value={form.date} onChange={e => setForm({...form, date: e.target.value})}
                    className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none`} />
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div className="space-y-2">
                    <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Clock className="w-4 h-4 mr-2"/> Startzeit</label>
                    <input type="time" required value={form.startTime} onChange={e => setForm({...form, startTime: e.target.value})}
                      className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none`} />
                  </div>
                  <div className="space-y-2">
                    <label className="text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center"><Clock className="w-4 h-4 mr-2"/> Endzeit</label>
                    <input type="time" required value={form.endTime} onChange={e => setForm({...form, endTime: e.target.value})}
                      className={`w-full p-3 text-base rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-${theme}-500 outline-none`} />
                  </div>
                </div>
                <button type="submit" className={`w-full py-4 bg-${theme}-600 hover:bg-${theme}-700 text-white rounded-xl font-bold shadow-lg shadow-${theme}-600/30 transition-all flex items-center justify-center mt-8 active:scale-[0.98]`}>
                  <CheckCircle2 className="w-5 h-5 mr-2" /> Eintrag speichern
                </button>
              </form>
            </div>
          );
        };

        const HistoryView = ({ entries, deleteEntry, settings }) => {
          const theme = settings.theme || 'indigo';
          const [selectedMonth, setSelectedMonth] = useState(new Date().toISOString().substring(0, 7));
          const [isGenerating, setIsGenerating] = useState(false);
          const filteredEntries = useMemo(() => entries.filter(e => e.date.startsWith(selectedMonth)), [entries, selectedMonth]);
          const stats = useMemo(() => filteredEntries.reduce((acc, curr) => ({ hours: acc.hours + curr.netHours, earned: acc.earned + curr.earned }), { hours: 0, earned: 0 }), [filteredEntries]);
          const displayMonth = selectedMonth.split('-').reverse().join('.');

          const shareViaWhatsApp = async () => {
            if (isGenerating) return;
            setIsGenerating(true);
            try {
              const printArea = document.querySelector('.print-area');
              const clone = printArea.cloneNode(true);
              clone.querySelectorAll('.hidden').forEach(el => el.classList.remove('hidden'));
              clone.querySelectorAll('.no-print').forEach(el => el.remove());
              const container = document.createElement('div');
              container.style.cssText = 'width: 800px; padding: 40px; background: white; color: black; font-family: sans-serif;';
              container.appendChild(clone);
              const fileName = (settings.userName ? `Arbeitszeiten_${settings.userName}_${selectedMonth}.pdf` : `Arbeitszeiten_${selectedMonth}.pdf`).replace(/\s+/g, '_');
              const pdfBlob = await html2pdf().set({ margin:0, filename:fileName, image:{type:'jpeg',quality:0.98}, html2canvas:{scale:2,useCORS:true}, jsPDF:{unit:'px',format:[800, 1131]} }).from(container).outputPdf('blob');
              const file = new File([pdfBlob], fileName, { type: 'application/pdf' });
              if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ title: 'Stundenzettel PDF', files: [file] });
              else { const a = document.createElement('a'); a.href = URL.createObjectURL(pdfBlob); a.download = fileName; a.click(); }
            } catch (err) { alert("PDF-Fehler!"); } finally { setIsGenerating(false); }
          };

          return (
            <div className="p-6 h-full flex flex-col animate-in slide-in-from-bottom-4 duration-300">
              <div className="flex justify-between items-center mb-6 no-print">
                <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Übersicht</h2>
                <input type="month" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} className="p-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white" />
              </div>
              <div className="grid grid-cols-2 gap-4 mb-6 no-print">
                <div className={`bg-${theme}-50 dark:bg-${theme}-900/30 p-4 rounded-2xl border border-${theme}-100 dark:border-${theme}-800/50`}><p className={`text-sm text-${theme}-600 mb-1`}>Stunden</p><p className="text-2xl font-bold">{stats.hours.toFixed(2)} h</p></div>
                <div className="bg-green-50 dark:bg-green-900/30 p-4 rounded-2xl border border-green-100 dark:border-green-800/50"><p className="text-sm text-green-600 mb-1">Verdienst</p><p className="text-2xl font-bold">{formatCurrency(stats.earned)}</p></div>
              </div>
              <div className="flex space-x-2 mb-6 no-print">
                <button onClick={() => window.print()} className="flex-1 p-2 bg-gray-900 text-white rounded-xl text-sm"><FileText className="w-4 h-4 inline mr-1"/> Drucken</button>
                <button onClick={shareViaWhatsApp} className="flex-1 p-2 bg-green-500 text-white rounded-xl text-sm"><Share2 className="w-4 h-4 inline mr-1"/> Teilen</button>
              </div>
              <div className="flex-1 overflow-y-auto space-y-3 pb-24 print-area">
                <div className="hidden print-block mb-6"><h3 className="text-2xl font-bold">Stundenzettel</h3><p>Mitarbeiter: {settings.userName || '___'}</p><p>Monat: {displayMonth}</p></div>
                {filteredEntries.map(entry => (
                  <div key={entry.id} className="bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-100 dark:border-gray-700 flex justify-between items-center group">
                    <div><p className="font-semibold">{formatDate(entry.date)}</p><p className="text-sm text-gray-500">{entry.startTime} - {entry.endTime}</p></div>
                    <div className="text-right flex items-center"><div className="mr-4"><p className={`font-bold text-${theme}-600`}>{entry.netHours} h</p><p className="text-xs text-gray-400">{formatCurrency(entry.earned)}</p></div>
                    <button onClick={() => deleteEntry(entry.id)} className="text-red-400 p-2"><Trash2 className="w-4 h-4" /></button></div>
                  </div>
                ))}
              </div>
            </div>
          );
        };

        const SettingsView = ({ settings, saveSettings, installPrompt, handleInstallClick }) => {
          const theme = settings.theme || 'indigo';
          const [pwaName, setPwaName] = useState(localStorage.getItem('pwa_app_name') || 'Zeiterfassung');
          const defaultIconSrc = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z'/%3E%3C/svg%3E";
          const [previewIcon, setPreviewIcon] = useState(localStorage.getItem('pwa_icon_192') || localStorage.getItem('pwa_app_icon') || defaultIconSrc);

          const handleIconSelect = (e) => {
            const file = e.target.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                  const size = Math.min(img.width, img.height);
                  const startX = (img.width - size) / 2;
                  const startY = (img.height - size) / 2;
                  const canvas = document.createElement('canvas');
                  canvas.width = 512; canvas.height = 512;
                  const ctx = canvas.getContext('2d');
                  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,512,512);
                  ctx.drawImage(img, startX, startY, size, size, 0, 0, 512, 512);
                  const iconUrl = canvas.toDataURL('image/png');
                  localStorage.setItem('pwa_icon_192', iconUrl);
                  localStorage.setItem('pwa_icon_512', iconUrl);
                  window.location.reload(); 
                };
                img.src = event.target.result;
              };
              reader.readAsDataURL(file);
            }
          };

          return (
            <div className="p-6 h-full overflow-y-auto pb-32">
              <h2 className="text-2xl font-bold mb-6">Einstellungen</h2>
              {installPrompt && (
                <div className="bg-green-50 dark:bg-green-900/20 p-6 rounded-2xl border border-green-200 mb-6">
                  <h3 className="font-bold text-green-900 dark:text-green-100">Dauerhaft installieren</h3>
                  <p className="text-xs text-green-700 dark:text-green-400 mb-4">Macht die App zu einer echten Android/iPhone App.</p>
                  <button onClick={handleInstallClick} className="w-full py-3 bg-green-600 text-white rounded-xl font-medium shadow-lg flex justify-center items-center"><Download className="w-5 h-5 mr-2" /> Jetzt Installieren</button>
                </div>
              )}
              <div className="space-y-6 bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 dark:border-gray-700 mb-6">
                <div className="flex justify-between items-center"><label className="text-sm font-medium">Dark Mode</label>
                <button onClick={() => saveSettings({...settings, darkMode: !settings.darkMode})} className={`h-6 w-11 rounded-full ${settings.darkMode ? `bg-${theme}-600` : 'bg-gray-300'}`}><span className={`block h-4 w-4 bg-white rounded-full transition ${settings.darkMode ? 'translate-x-6' : 'translate-x-1'}`}/></button></div>
                <div className="space-y-2"><label className="text-sm font-medium">Name</label>
                <input type="text" value={settings.userName} onChange={e => saveSettings({...settings, userName: e.target.value})} className="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 dark:bg-gray-900" placeholder="Name" /></div>
                <div className="space-y-2"><label className="text-sm font-medium">Lohn (€)</label>
                <input type="number" value={settings.hourlyRate} onChange={e => saveSettings({...settings, hourlyRate: parseFloat(e.target.value) || 0})} className="w-full p-3 rounded-xl border border-gray-200 bg-gray-50 dark:bg-gray-900" /></div>
              </div>
              <div className="bg-white dark:bg-gray-800 p-6 rounded-2xl border border-gray-100 mb-6">
                <h3 className="font-bold mb-3">Design-Farbe</h3>
                <div className="grid grid-cols-6 gap-3">{tailwindColors.map(c => (<button key={c} onClick={() => saveSettings({...settings, theme: c})} className={`w-10 h-10 rounded-full bg-${c}-500 border-2 ${settings.theme === c ? 'border-black' : 'border-transparent'}`} />))}</div>
              </div>
              <div className={`bg-${theme}-50 dark:bg-${theme}-900/20 p-6 rounded-2xl border border-${theme}-100`}>
                <h3 className="font-bold">Personalisieren</h3>
                <div className="mt-3"><label className="text-sm font-medium">App Name</label><div className="flex mt-1"><input type="text" value={pwaName} onChange={e => setPwaName(e.target.value)} className="flex-1 p-3 rounded-xl border" /><button onClick={() => { localStorage.setItem('pwa_app_name', pwaName); window.location.reload(); }} className={`ml-2 px-4 bg-${theme}-600 text-white rounded-xl`}>OK</button></div></div>
                <div className="mt-4 flex items-center space-x-3"><img src={previewIcon} className="w-16 h-16 rounded-2xl object-cover" /><label className="flex-1 p-4 border-2 border-dashed rounded-xl text-center cursor-pointer">Bild wählen<input type="file" accept="image/*" onChange={handleIconSelect} className="hidden" /></label></div>
              </div>
            </div>
          );
        };

        // ==========================================
        // APP
        // ==========================================
        function App() {
          const [currentView, setCurrentView] = useState('manual');
          const tracker = useTimeTracker();
          const theme = tracker.settings.theme || 'indigo';
          const [installPrompt, setInstallPrompt] = useState(null);

          useEffect(() => {
            const handlePrompt = (e) => { e.preventDefault(); setInstallPrompt(e); };
            window.addEventListener('beforeinstallprompt', handlePrompt);
            return () => window.removeEventListener('beforeinstallprompt', handlePrompt);
          }, []);

          const handleInstallClick = async () => { if (installPrompt) { installPrompt.prompt(); const { outcome } = await installPrompt.userChoice; if (outcome === 'accepted') setInstallPrompt(null); } };

          useEffect(() => {
            if (tracker.settings.darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [tracker.settings.darkMode]);

          return (
            <div className="max-w-md mx-auto h-full flex flex-col bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
              <header className="px-6 py-4 flex items-center justify-between no-print border-b border-gray-200 bg-white dark:bg-gray-900">
                <div className="flex items-center space-x-3"><Clock className={`w-6 h-6 text-${theme}-600`} /><h1 className={`text-xl font-bold text-${theme}-600`}>{localStorage.getItem('pwa_app_name') || 'Zeiterfassung'}</h1></div>
              </header>
              <main className="flex-1 overflow-hidden relative">
                {currentView === 'manual' && <ManualEntryView {...tracker} setView={setCurrentView} />}
                {currentView === 'history' && <HistoryView {...tracker} />}
                {currentView === 'settings' && <SettingsView {...tracker} installPrompt={installPrompt} handleInstallClick={handleInstallClick} />}
              </main>
              <nav className="bg-white dark:bg-gray-800 border-t border-gray-200 px-6 py-3 no-print shrink-0 flex justify-around">
                {[ {id:'manual', icon:Plus, label:'Neu'}, {id:'history', icon:List, label:'Liste'}, {id:'settings', icon:Settings, label:'Setup'} ].map(item => (
                  <button key={item.id} onClick={() => setCurrentView(item.id)} className={`flex flex-col items-center ${currentView === item.id ? `text-${theme}-600 scale-110` : 'text-gray-400'}`}>
                    <item.icon className="w-6 h-6 mb-1"/><span className="text-[10px]">{item.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <!-- STABILE SERVICE WORKER REGISTRIERUNG (Keine fehleranfälligen Blobs mehr!) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Wir verwenden eine minimalistische fetch-Proxy-Strategie in einem statischen String
                const swContent = "self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request).catch(function() { return new Response('Offline'); })); });";
                const blob = new Blob([swContent], { type: 'application/javascript' });
                const workerUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(workerUrl, { scope: './' })
                    .then(reg => console.log('PWA aktiv.'))
                    .catch(err => {});
            });
        }
    </script>
</body>
</html>
